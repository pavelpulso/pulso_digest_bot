<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Настольный ассистент</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Ассистент%22%2C%22short_name%22%3A%22Ассистент%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0d10%22%2C%22theme_color%22%3A%22%230b0d10%22%7D">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #e8eaed;
    --dim: #7c848d;
    --accent: #6ea8fe;
    --warm: #f0b866;
    --eye: #e8eaed;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ---------- face ---------- */
  #face {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12vw;
    position: relative;
  }
  .eye {
    width: 18vw;
    height: 18vw;
    max-width: 120px;
    max-height: 120px;
    border-radius: 50%;
    background: var(--eye);
    position: relative;
    transition: height .18s ease, transform .18s ease, background .3s ease;
  }
  .eye::after {
    content: "";
    position: absolute;
    inset: 22%;
    border-radius: 50%;
    background: var(--bg);
    opacity: .55;
    transition: inset .2s ease;
  }
  /* blink */
  body.blink .eye { height: 6%; }
  /* listening: pupils widen, tint */
  body.listening .eye { background: var(--accent); transform: scale(1.06); }
  body.listening .eye::after { inset: 30%; }
  /* thinking: eyes narrow and drift */
  body.thinking .eye { height: 8vw; background: var(--warm); }
  body.thinking #left { transform: translateX(-6px); }
  body.thinking #right { transform: translateX(6px); }
  /* speaking: gentle pulse */
  @keyframes talk { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.82); } }
  body.speaking .eye { animation: talk .42s ease-in-out infinite; }
  /* error */
  body.error .eye { background: #e07a7a; }

  /* ---------- transcript ---------- */
  #log {
    max-height: 34vh;
    overflow-y: auto;
    padding: 0 20px 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #log::-webkit-scrollbar { display: none; }
  .turn { margin: 10px 0; font-size: 15px; }
  .turn.me { color: var(--dim); }
  .turn.me::before { content: "— "; }
  .turn.ai { color: var(--fg); }

  /* ---------- controls ---------- */
  #bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid #1b1f25;
  }
  #status { flex: 1; color: var(--dim); font-size: 14px; min-height: 20px; }
  button {
    font: inherit;
    color: var(--fg);
    background: #161a20;
    border: 1px solid #232830;
    border-radius: 12px;
    padding: 12px 18px;
    cursor: pointer;
  }
  button:active { background: #1e242c; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07101f; font-weight: 600; }
  button.primary.on { background: #e07a7a; border-color: #e07a7a; }
  #gear { padding: 12px 14px; }

  /* ---------- settings ---------- */
  #setup {
    position: fixed;
    inset: 0;
    background: var(--bg);
    padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
    display: none;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    user-select: text;
  }
  #setup.open { display: flex; }
  #setup h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  #setup p { margin: 0; color: var(--dim); font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  input, textarea, select {
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: #12161c;
    border: 1px solid #232830;
    border-radius: 10px;
    padding: 12px;
  }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
</style>
</head>
<body>

<div id="face">
  <div class="eye" id="left"></div>
  <div class="eye" id="right"></div>
</div>

<div id="log"></div>

<div id="bar">
  <div id="status">Нажми «Говорить»</div>
  <button id="gear" title="Настройки">⚙</button>
  <button id="talk" class="primary">Говорить</button>
</div>

<div id="setup">
  <h1>Настройки</h1>
  <p>Ключ хранится только в этом браузере и никуда больше не отправляется, кроме выбранного провайдера.</p>

  <div>
    <label for="provider">Провайдер</label>
    <select id="provider">
      <option value="openrouter">OpenRouter</option>
      <option value="gemini">Google Gemini</option>
    </select>
  </div>

  <div>
    <label for="key">API-ключ</label>
    <input id="key" type="password" autocomplete="off" placeholder="sk-or-v1-… или AIza…">
  </div>

  <div>
    <label for="model">Модель</label>
    <input id="model" type="text" placeholder="minimax/minimax-m3:free">
  </div>

  <div>
    <label for="persona">Кто ты и как отвечать</label>
    <textarea id="persona" placeholder="Отвечай коротко, по делу, на русском."></textarea>
  </div>

  <div class="row">
    <div>
      <label for="lang">Язык распознавания</label>
      <select id="lang">
        <option value="ru-RU">Русский</option>
        <option value="es-ES">Español</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <div>
      <label for="continuous">Режим</label>
      <select id="continuous">
        <option value="0">По кнопке</option>
        <option value="1">Непрерывно</option>
      </select>
    </div>
  </div>

  <button id="save" class="primary">Сохранить</button>
  <button id="close">Закрыть</button>
</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const logEl = $("log"), statusEl = $("status"), talkBtn = $("talk");

  const DEFAULTS = {
    provider: "openrouter",
    key: "",
    model: "minimax/minimax-m3:free",
    persona: "Ты настольный голосовой ассистент. Отвечай на русском, коротко и по делу — три-четыре предложения, без списков и заголовков, потому что ответ будет прочитан вслух. Если вопрос требует長 длинного ответа, дай суть и предложи уточнить.",
    lang: "ru-RU",
    continuous: "0"
  };

  const cfg = load();

  function load() {
    const out = { ...DEFAULTS };
    try {
      const raw = localStorage.getItem("assistant.cfg");
      if (raw) Object.assign(out, JSON.parse(raw));
    } catch (e) { /* private mode or blocked storage — defaults are fine */ }
    return out;
  }

  function save() {
    try { localStorage.setItem("assistant.cfg", JSON.stringify(cfg)); }
    catch (e) { setStatus("Не удалось сохранить настройки в этом браузере"); }
  }

  // ---------- face state ----------
  let faceTimer = null;
  function setFace(state) {
    body.classList.remove("listening", "thinking", "speaking", "error");
    if (state) body.classList.add(state);
  }
  function setStatus(text) { statusEl.textContent = text; }

  // idle blinking, paused while listening so the eyes look attentive
  setInterval(() => {
    if (body.classList.contains("listening")) return;
    body.classList.add("blink");
    setTimeout(() => body.classList.remove("blink"), 130);
  }, 4200);

  function addTurn(who, text) {
    const div = document.createElement("div");
    div.className = "turn " + who;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
  }

  // ---------- speech recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false, wantListening = false;

  function buildRec() {
    if (!SR) return null;
    const r = new SR();
    r.lang = cfg.lang;
    r.interimResults = true;
    r.continuous = false;   // Android Chrome ignores true anyway; we restart manually
    r.maxAlternatives = 1;

    r.onstart = () => { listening = true; setFace("listening"); setStatus("Слушаю…"); talkBtn.classList.add("on"); talkBtn.textContent = "Стоп"; };
    r.onresult = (e) => {
      let finalText = "";
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) finalText += res[0].transcript;
        else interim += res[0].transcript;
      }
      if (interim) setStatus(interim.trim());
      if (finalText.trim()) {
        stopListening();
        ask(finalText.trim());
      }
    };
    r.onerror = (e) => {
      listening = false;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        wantListening = false;
        setFace("error");
        setStatus("Доступ к микрофону запрещён — разреши в настройках сайта");
        resetBtn();
        return;
      }
      if (e.error === "no-speech" || e.error === "aborted" || e.error === "network") {
        // ordinary in continuous use; the onend handler decides whether to resume
        return;
      }
      setStatus("Ошибка распознавания: " + e.error);
    };
    r.onend = () => {
      listening = false;
      talkBtn.classList.remove("on");
      if (wantListening && !speaking) {
        // Android ends recognition every few seconds; restart to keep it open
        try { r.start(); } catch (err) { setTimeout(() => { if (wantListening) try { r.start(); } catch (e2) {} }, 350); }
      } else {
        resetBtn();
        if (!body.classList.contains("thinking") && !body.classList.contains("speaking")) setFace(null);
      }
    };
    return r;
  }

  function resetBtn() { talkBtn.textContent = "Говорить"; talkBtn.classList.remove("on"); }

  function startListening() {
    if (!SR) { setFace("error"); setStatus("Этот браузер не умеет распознавать речь — нужен Chrome"); return; }
    if (!cfg.key) { openSetup(); setStatus("Сначала укажи API-ключ"); return; }
    if (!rec) rec = buildRec();
    rec.lang = cfg.lang;
    wantListening = true;
    stopSpeaking();
    try { rec.start(); } catch (e) { /* already started */ }
  }

  function stopListening() {
    wantListening = false;
    if (rec && listening) { try { rec.abort(); } catch (e) {} }
    listening = false;
    resetBtn();
  }

  talkBtn.addEventListener("click", () => {
    if (listening || wantListening) { stopListening(); setFace(null); setStatus("Пауза"); }
    else startListening();
  });

  // tapping the face also toggles, so the phone works as a stand-up device
  $("face").addEventListener("click", () => talkBtn.click());

  // ---------- speech synthesis ----------
  let speaking = false;
  let voices = [];
  function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  loadVoices();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

  function stopSpeaking() {
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
    speaking = false;
  }

  function say(text) {
    if (!window.speechSynthesis) { afterSpeak(); return; }
    stopSpeaking();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = cfg.lang;
    const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(cfg.lang.slice(0, 2).toLowerCase()));
    if (v) u.voice = v;
    u.rate = 1.02;
    u.onstart = () => { speaking = true; setFace("speaking"); setStatus("Говорю…"); };
    u.onend = () => { speaking = false; afterSpeak(); };
    u.onerror = () => { speaking = false; afterSpeak(); };
    try { speechSynthesis.speak(u); } catch (e) { afterSpeak(); }
  }

  function afterSpeak() {
    setFace(null);
    if (cfg.continuous === "1") { setStatus("Слушаю…"); startListening(); }
    else setStatus("Нажми «Говорить»");
  }

  // ---------- the model ----------
  const history = [];

  async function ask(question) {
    addTurn("me", question);
    setFace("thinking");
    setStatus("Думаю…");
    history.push({ role: "user", content: question });
    while (history.length > 12) history.shift();

    try {
      const answer = await callModel(history);
      history.push({ role: "assistant", content: answer });
      addTurn("ai", answer);
      say(answer);
    } catch (e) {
      setFace("error");
      const msg = String(e.message || e).slice(0, 160);
      setStatus("Ошибка: " + msg);
      addTurn("ai", "Не получилось: " + msg);
      setTimeout(() => { if (body.classList.contains("error")) { setFace(null); setStatus("Нажми «Говорить»"); } }, 4000);
    }
  }

  async function callModel(messages) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 45000);
    try {
      if (cfg.provider === "gemini") return await callGemini(messages, ctl.signal);
      return await callOpenRouter(messages, ctl.signal);
    } finally { clearTimeout(timer); }
  }

  async function callOpenRouter(messages, signal) {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
      body: JSON.stringify({
        model: cfg.model || DEFAULTS.model,
        messages: [{ role: "system", content: cfg.persona }, ...messages],
        max_tokens: 400,
        temperature: 0.7
      })
    });
    const j = await res.json().catch(() => null);
    if (!res.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + res.status));
    const text = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
    if (!text) throw new Error("пустой ответ модели");
    return text.trim();
  }

  async function callGemini(messages, signal) {
    const model = cfg.model && cfg.model.includes("gemini") ? cfg.model : "gemini-3.6-flash";
    const url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(cfg.key);
    const res = await fetch(url, {
      method: "POST",
      signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: cfg.persona }] },
        contents: messages.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
        generationConfig: { maxOutputTokens: 400, temperature: 0.7 }
      })
    });
    const j = await res.json().catch(() => null);
    if (!res.ok) throw new Error((j && j.error && j.error.message) || ("HTTP " + res.status));
    const text = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts
      && j.candidates[0].content.parts.map(p => p.text || "").join("");
    if (!text) throw new Error("пустой ответ модели");
    return text.trim();
  }

  // ---------- settings ui ----------
  function openSetup() {
    $("provider").value = cfg.provider;
    $("key").value = cfg.key;
    $("model").value = cfg.model;
    $("persona").value = cfg.persona;
    $("lang").value = cfg.lang;
    $("continuous").value = cfg.continuous;
    $("setup").classList.add("open");
  }
  $("gear").addEventListener("click", () => { stopListening(); stopSpeaking(); openSetup(); });
  $("close").addEventListener("click", () => $("setup").classList.remove("open"));
  $("save").addEventListener("click", () => {
    cfg.provider = $("provider").value;
    cfg.key = $("key").value.trim();
    cfg.model = $("model").value.trim();
    cfg.persona = $("persona").value.trim() || DEFAULTS.persona;
    cfg.lang = $("lang").value;
    cfg.continuous = $("continuous").value;
    save();
    $("setup").classList.remove("open");
    setStatus(cfg.key ? "Готово. Нажми «Говорить»" : "Без ключа не заработает");
  });

  // keep the screen awake while it sits on the desk
  (async () => {
    try {
      if ("wakeLock" in navigator) {
        let lock = await navigator.wakeLock.request("screen");
        document.addEventListener("visibilitychange", async () => {
          if (document.visibilityState === "visible" && "wakeLock" in navigator) {
            try { lock = await navigator.wakeLock.request("screen"); } catch (e) {}
          }
        });
      }
    } catch (e) { /* not fatal — the phone just dims as usual */ }
  })();

  if (!cfg.key) { setStatus("Открой настройки и вставь ключ"); openSetup(); }
  if (!SR) { setFace("error"); setStatus("Нужен Chrome — этот браузер не распознаёт речь"); }
})();
</script>
</body>
</html>
